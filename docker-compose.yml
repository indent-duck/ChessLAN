services:
  chesslan:
    build: .
    container_name: chesslan-dev
    ports:
      - "8081:8081"
      - "19000:19000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.expo
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=YOUR_HOST_IP # SET THIS TO YOUR DEVICE'S IP ADDRESS
    stdin_open: true
    tty: true
